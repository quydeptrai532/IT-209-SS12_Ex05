
name: Fixed CI CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    name: Build Test and Docker
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # FIX 1: Grant execute permission
      - name: Fix Gradle Permission
        run: chmod +x gradlew

      - name: Run Gradle Tests
        run: ./gradlew test

      # FIX 2: Correct registry authentication
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=ex5-fixed

      # FIX 3: Correct Docker build context
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
